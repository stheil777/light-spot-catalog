name: Spot-Katalog aus OSM

# Einmal die Woche die ganze Welt aus den OSM-Komplettdaten von Geofabrik:
# je Kontinent herunterladen, mit osmium auf die Spot-Arten filtern, in
# 5-Grad-Zellen schneiden. Danach ist jede Zelle der Welt im Katalog.
# Hoehen kommen aus dem letzten Katalog; fehlende traegt build.yml taeglich nach.
# Overpass wird dafuer nicht mehr gefragt: die Server schafften am Tag nur
# rund 40 Zellen (504, Timeouts, 429).
#
# Faellt eine Region aus, wird nichts veroeffentlicht (sonst fehlten an ihren
# Raendern Spots). Dann: "Re-run failed jobs".
# Von Hand geht auch ein Teil, z. B. regions = ["europe"]: dann behaelt der
# Rest der Welt den letzten Stand.
on:
  schedule:
    - cron: "17 1 * * 0"
  workflow_dispatch:
    inputs:
      regions:
        description: 'Nur diese Regionen, z. B. ["europe"]; leer = ganze Welt'
        required: false
        default: ""
      from_run:
        description: 'Regionen nicht neu laden, sondern aus diesem Lauf nehmen (Run-ID)'
        required: false
        default: ""

permissions:
  contents: read

# Dieselbe Gruppe wie build.yml: nie zwei Laeufe gleichzeitig am Release.
concurrency:
  group: spot-catalog
  cancel-in-progress: false

jobs:
  region:
    name: OSM ${{ matrix.region }}
    if: ${{ !inputs.from_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      # Drei gleichzeitig: Geofabrik wird von Freiwilligen betrieben.
      max-parallel: 3
      matrix:
        region: ${{ fromJSON(inputs.regions || '["europe", "asia", "north-america", "africa", "south-america", "russia", "australia-oceania", "central-america", "antarctica"]') }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: osmium installieren
        run: sudo apt-get update -q && sudo apt-get install -y -q osmium-tool
      - run: pip install pillow==10.4.0 && python build_catalog.py --selftest
      - name: Platz schaffen
        # Europa sind ueber 30 GB. Vorinstalliertes, das hier keiner braucht, weg.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          DIR=$(df --output=avail,target / /mnt 2>/dev/null | tail -n +2 | sort -n | tail -1 | awk '{print $2}')
          sudo mkdir -p "$DIR/osm" && sudo chown "$USER" "$DIR/osm"
          echo "WORK=$DIR/osm" >> "$GITHUB_ENV"
          df -h / /mnt || true
      - name: Herunterladen
        run: |
          UA="LIGHT-SpotCatalog/1.0 (+https://github.com/stheil777/light-spot-catalog)"
          # "latest" leitet auf die Datei mit Datum weiter. Die feste Datei
          # holen: am 01.10.2026 kam waehrend des Downloads eine neue heraus,
          # und die Pruefsumme zu "latest" gab 404.
          URL=$(curl -fsSIL --retry 5 -A "$UA" -o /dev/null -w '%{url_effective}' \
            "https://download.geofabrik.de/${{ matrix.region }}-latest.osm.pbf")
          echo "$URL"
          # Haengt die Verbindung (unter 2 MB/s fuer 2 Minuten), neu verbinden und
          # weiterladen. Am 01.10.2026 krochen Asien und Nordamerika mit 1 MB/s
          # in die 5-Stunden-Grenze, Europa kam mit 58 MB/s in 10 Minuten.
          curl -fsSL --retry 20 --retry-all-errors -C - --speed-limit 2000000 --speed-time 120 \
            -A "$UA" -o "$WORK/region.osm.pbf" "$URL" \
            -w "%{size_download} Bytes in %{time_total} s (%{speed_download} B/s)\n"
          curl -fsSL --retry 5 -A "$UA" "$URL.md5" | awk -v f="$WORK/region.osm.pbf" '{print $1"  "f}' | md5sum -c -
          ls -la "$WORK/region.osm.pbf"
      - name: Filtern und schneiden
        run: |
          # Grob wie die alte Overpass-Abfrage; genau filtert build_catalog.py.
          osmium tags-filter "$WORK/region.osm.pbf" \
            nwr/tourism=viewpoint nwr/man_made=lighthouse \
            nwr/natural=beach,peak,cliff,rock nwr/tower:type=observation \
            nwr/historic=castle,ruins \
            -o "$WORK/spots.osm.pbf"
          rm "$WORK/region.osm.pbf"
          osmium export "$WORK/spots.osm.pbf" -f geojsonseq -x print_record_separator=false \
            --add-unique-id=type_id -o "$WORK/spots.geojsonseq"
          osmium add-locations-to-ways -n "$WORK/spots.osm.pbf" -f opl -o "$WORK/spots.opl"
          python build_catalog.py --site-relations "$WORK/spots.opl" "$WORK/spots.geojsonseq"
          python build_catalog.py --split-osm "$WORK/spots.geojsonseq" --out "osm/${{ matrix.region }}"
      - uses: actions/upload-artifact@v7
        with:
          name: osm-${{ matrix.region }}
          path: osm/
          retention-days: 7

  release:
    name: Veroeffentlichen
    needs: region
    if: ${{ !cancelled() && (needs.region.result == 'success' || inputs.from_run) }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v8
        with:
          path: osm
          pattern: osm-*
          merge-multiple: true
          run-id: ${{ inputs.from_run || github.run_id }}
          github-token: ${{ github.token }}
      - name: Letzten Katalog holen (fuer die Hoehen)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p previous
          gh release download --repo "$GITHUB_REPOSITORY" --pattern "*" --dir previous \
            || echo "Noch kein Katalog veroeffentlicht"
      - name: Zusammensetzen
        run: |
          python build_catalog.py --assemble-osm osm --previous previous --out release \
            ${{ inputs.regions && '--partial' || '' }}
      - name: Veroeffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./publish.sh
