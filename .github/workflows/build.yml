name: Spot-Katalog bauen

# Laeuft von allein, jeden Tag frueh. Jeder Lauf holt bis zu ~420 Zellen neu
# aus OSM (nur Zellen mit Land, siehe land_cells.json; nie gesehene zuerst,
# vom Rheintal und Madeira nach aussen, dann die aeltesten) und traegt
# fehlende Standpunkthoehen nach. Nach ~3 Tagen ist die Welt einmal durch.
# Jedes Band hoert nach 290 Minuten auf und speichert, was es hat.
#
# Budgets, damit niemand die App sperrt:
# - Overpass: ~420 Abfragen, ~300 MB am Tag (erbeten: <10 000 und <1 GB).
#   Bei "429 zu viel" hoert der Lauf mit OSM sofort auf.
# - Mapterhorn: 2000 Kacheln je Band, nur fuer Spots am Hang.
#   Bei 403/429/503 ist fuer den Tag Schluss.
# Von Hand: "Actions -> Spot-Katalog bauen -> Run workflow".
on:
  push:
    branches: [main]
    paths:
      - build_catalog.py
      - .github/workflows/build.yml
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

# Grundsaetzlich nur lesen. Schreiben darf allein der Schritt, der
# veroeffentlicht: laeuft in einem Band fremder Code (z. B. ueber ein
# kompromittiertes Paket), kann er so kein Release austauschen.
permissions:
  contents: read

concurrency:
  group: spot-catalog
  cancel-in-progress: false

jobs:
  band:
    name: Band ${{ matrix.band }}
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      # Zwei gleichzeitig: Overpass erlaubt zwei Abfragen parallel, mehr
      # waere unhoeflich gegenueber den Betreibern.
      max-parallel: 2
      matrix:
        band: [0, 1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install pillow==10.4.0
      - name: Letzten Katalog holen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p previous
          gh release download --repo "$GITHUB_REPOSITORY" --pattern "*" --dir previous \
            || echo "Noch kein Katalog veroeffentlicht"
      - name: Band bauen
        # Unter der Job-Grenze (340), damit danach noch hochgeladen wird.
        timeout-minutes: 320
        run: |
          python build_catalog.py --band ${{ matrix.band }} --bands 6 \
            --previous previous --out out --crawl-cells 70 --height-budget 2000 \
            --time-budget 290
      # Auch nach Abbruch oder Fehler: jede fertige Zelle zaehlt.
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: band-${{ matrix.band }}
          path: out/
          retention-days: 3

  release:
    name: Veroeffentlichen
    needs: band
    # Auch wenn ein Band ausfaellt: dessen Zellen kommen aus der Vorwoche.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v8
        with:
          path: bands
          pattern: band-*
          merge-multiple: true
      - name: Letzten Katalog holen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p previous
          gh release download --repo "$GITHUB_REPOSITORY" --pattern "*" --dir previous \
            || echo "Noch kein Katalog veroeffentlicht"
      - name: Zusammensetzen
        run: python build_catalog.py --assemble bands --previous previous --out release
      - name: Als Release veroeffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="catalog-$(date -u +%Y%m%d-%H%M)"
          gh release create "$TAG" release/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Spot-Katalog $(date -u +%Y-%m-%d)" \
            --notes "Daten © OpenStreetMap-Mitwirkende, ODbL. Standpunkthoehen: Mapterhorn (https://mapterhorn.com/attribution)." \
            --latest
          # Nur die zwei neuesten Kataloge behalten.
          gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName,createdAt \
            --jq 'sort_by(.createdAt) | reverse | .[2:] | .[].tagName' \
            | while read -r old; do
                gh release delete "$old" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
              done
      - name: Stand ins Issue 'Katalog-Status' schreiben
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FAILED=$(gh run view ${{ github.run_id }} --repo "$GITHUB_REPOSITORY" --json jobs \
            --jq '[.jobs[] | select(.name | startswith("Band")) | select(.conclusion != "success") | .name] | join(", ")')
          python build_catalog.py --status release --failed-bands "$FAILED" > status.md
          cat status.md
          gh issue comment 1 --repo "$GITHUB_REPOSITORY" --body-file status.md
