name: Spot-Katalog bauen

# Laeuft jeden Tag und traegt fehlende Standpunkthoehen nach (Rheintal
# zuerst). Die Orte selbst kommen einmal die Woche aus osm.yml.
# Jedes Band hoert nach 290 Minuten auf und speichert, was es hat.
#
# Hoehen aus Mapterhorns PMTiles, per Range-Request vom Spiegel auf Source
# Cooperative; so bittet Mapterhorn darum (statt Einzelabrufen am
# Kachel-Endpoint, bis 02.10.2026 mit 2000 Kacheln je Band und Tag).
# Bei 403/429/503 ist fuer den Tag Schluss.
# Von Hand: "Actions -> Spot-Katalog bauen -> Run workflow".
on:
  push:
    branches: [main]
    paths:
      - build_catalog.py
      - .github/workflows/build.yml
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

# Grundsaetzlich nur lesen. Schreiben darf allein der Schritt, der
# veroeffentlicht: laeuft in einem Band fremder Code (z. B. ueber ein
# kompromittiertes Paket), kann er so kein Release austauschen.
permissions:
  contents: read

concurrency:
  group: spot-catalog
  cancel-in-progress: false

jobs:
  band:
    name: Band ${{ matrix.band }}
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        band: [0, 1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install pillow==10.4.0 pmtiles==3.8.1
      - name: Letzten Katalog holen
        run: ./fetch_previous.sh
      - name: Band bauen
        # Unter der Job-Grenze (340), damit danach noch hochgeladen wird.
        timeout-minutes: 320
        run: |
          python build_catalog.py --band ${{ matrix.band }} --bands 6 \
            --previous previous --out out \
            --time-budget 290
      # Auch nach Abbruch oder Fehler: jede fertige Zelle zaehlt.
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: band-${{ matrix.band }}
          path: out/
          retention-days: 3

  release:
    name: Veroeffentlichen
    needs: band
    # Auch wenn ein Band ausfaellt: dessen Zellen bleiben wie im letzten Katalog.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v8
        with:
          path: bands
          pattern: band-*
          merge-multiple: true
      - name: Letzten Katalog holen
        run: ./fetch_previous.sh
      - name: Zusammensetzen
        run: python build_catalog.py --assemble bands --previous previous --out release
      - name: Veroeffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FAILED=$(gh run view ${{ github.run_id }} --repo "$GITHUB_REPOSITORY" --json jobs \
            --jq '[.jobs[] | select(.name | startswith("Band")) | select(.conclusion != "success") | .name] | join(", ")')
          ./publish.sh "$FAILED"
